site_name: China AI Hub Data
site_description: 'Data layer for China AI Hub — structured reference for China''s
  AI ecosystem: models, companies, agents, APIs, pricing and benchmarks.'
site_url: https://data.sinoaihub.com
site_author: China AI Hub
copyright: © 2026 China AI Hub
theme:
  name: material
  custom_dir: overrides
  palette:
    primary: indigo
    accent: indigo
  features:
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - git-revision-date-localized
hooks:
  - hooks.py
plugins:
- search
- git-revision-date-localized:
    fallback_to_build_date: true
